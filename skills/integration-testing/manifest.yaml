id: integration-testing
name: integration-testing
version: 1.0.0
description: Formulates and executes end-to-end integration and acceptance test suites
  based directly on PRD acceptance criteria.
category: testing
supported_roles: &id001
- qa_engineer
compatible_roles: *id001
required_inputs:
- prd_acceptance_criteria
- unified_diff
- sandbox_environment
required_capabilities:
- syntra.read_file
- syntra.write_file
- syntra.run_command
required_tools:
- syntra.read_file
- syntra.write_file
- syntra.run_command
output_schema:
  type: object
  required:
  - scenario_name
  - given_when_then_results
  - all_scenarios_passed
  properties:
    scenario_name:
      type: string
    given_when_then_results:
      type: array
    all_scenarios_passed:
      type: boolean
    trace_log:
      type: string
verification_rules:
- Acceptance tests must be independently formulated from the PRD, not copied from
  developer unit tests.
- Tests must execute inside clean sandbox environments with mocked external third-party
  services.
- All scenarios must pass for a successful verification run.
dependencies:
- test-driven-development>=1.0.0
references:
- title: 'Martin Fowler: Integration Tests'
  uri: https://martinfowler.com/bliki/IntegrationTest.html
- title: SYNTRA AGENTS.md QA Invariant
  uri: AGENTS.md#26-qa-engineer
evaluation_cases:
- name: test_e2e_mission_lifecycle
  input_data:
    scenario: create_and_execute_mission
  expected_status: SUCCESS
