# SYNTRA Default Configuration Template

app:
  name: "SYNTRA"
  description: "Synchronized Intelligence for Autonomous Engineering"
  version: "0.1.0"
  tagline: "One Vision. Multiple AI Agents. Autonomous Engineering."

server:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"

storage:
  database_url: "sqlite+aiosqlite:///./syntra.db"
  redis_url: "redis://localhost:6379/0"
  s3:
    endpoint: "localhost:9000"
    access_key: "syntra_minio"
    secret_key: "syntra_minio_secret"
    bucket: "syntra-artifacts"
    secure: false

models:
  default: "gemini-2.5-flash"
  reasoning: "gemini-2.5-pro"
  fast: "gemini-2.5-flash"
  temperature: 0.2
  max_tokens: 8192

autonomy:
  mode: "semi_autonomous"
  max_steps: 30
  auto_approve_safe_reads: true
