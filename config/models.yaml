# SYNTRA Model Registry Configuration
# Source: Google Cloud Vertex AI & Google AI Studio official documentation & pricing
# Effective Date: 2026-10-15

models:
  gemini-2.5-pro:
    provider: gemini
    model_id: gemini-2.5-pro
    enabled: true
    lifecycle_status: ACTIVE
    supported_capabilities:
      - text_generation
      - structured_output
      - function_calling
      - code_execution
    max_output_tokens: 8192
    context_policy:
      context_window_tokens: 2097152
      truncation_strategy: prioritize_system_and_recent
    timeout_seconds: 90.0
    retry_policy:
      max_retries: 3
      initial_delay_seconds: 1.0
      backoff_multiplier: 2.0
      max_delay_seconds: 10.0
    pricing_configuration:
      pricing_known: true
      source: "https://ai.google.dev/gemini-api/docs/pricing"
      effective_date: "2026-10-15"
      input_per_million_usd: 1.25
      output_per_million_usd: 10.00
      long_context_threshold_tokens: 200000
      long_context_input_per_million_usd: 2.50
      long_context_output_per_million_usd: 15.00
      unknown_cost_policy: conservative_fallback
      fallback_input_per_million_usd: 2.50
      fallback_output_per_million_usd: 15.00

  gemini-2.5-flash:
    provider: gemini
    model_id: gemini-2.5-flash
    enabled: true
    lifecycle_status: ACTIVE
    supported_capabilities:
      - text_generation
      - structured_output
      - function_calling
    max_output_tokens: 8192
    context_policy:
      context_window_tokens: 1048576
      truncation_strategy: prioritize_system_and_recent
    timeout_seconds: 60.0
    retry_policy:
      max_retries: 3
      initial_delay_seconds: 1.0
      backoff_multiplier: 2.0
      max_delay_seconds: 10.0
    pricing_configuration:
      pricing_known: true
      source: "https://ai.google.dev/gemini-api/docs/pricing"
      effective_date: "2026-10-15"
      input_per_million_usd: 0.30
      output_per_million_usd: 2.50
      unknown_cost_policy: conservative_fallback
      fallback_input_per_million_usd: 2.50
      fallback_output_per_million_usd: 10.00

  gemini-2.0-flash-lite:
    provider: gemini
    model_id: gemini-2.0-flash-lite
    enabled: false
    deprecated: true
    shutdown_date: "2026-06-01"
    replacement: "gemini-2.5-flash"
    lifecycle_status: SHUTDOWN
    supported_capabilities:
      - text_generation
      - structured_output
      - function_calling
    max_output_tokens: 8192
    context_policy:
      context_window_tokens: 1048576
      truncation_strategy: prioritize_system_and_recent
    timeout_seconds: 30.0
    retry_policy:
      max_retries: 3
      initial_delay_seconds: 1.0
      backoff_multiplier: 2.0
      max_delay_seconds: 10.0
    pricing_configuration:
      pricing_known: false
      source: "Google AI Studio Historical (Retired)"
      effective_date: "2026-06-01"
      input_per_million_usd: 0.075
      output_per_million_usd: 0.30
      unknown_cost_policy: reject
      fallback_input_per_million_usd: 2.50
      fallback_output_per_million_usd: 10.00

  mock-model:
    provider: mock
    model_id: mock-model
    enabled: true
    lifecycle_status: ACTIVE
    supported_capabilities:
      - text_generation
      - structured_output
      - function_calling
    max_output_tokens: 4096
    context_policy:
      context_window_tokens: 1000000
      truncation_strategy: none
    timeout_seconds: 10.0
    retry_policy:
      max_retries: 1
      initial_delay_seconds: 0.1
      backoff_multiplier: 1.0
      max_delay_seconds: 1.0
    pricing_configuration:
      pricing_known: true
      source: "Mock Deterministic Test Provider"
      effective_date: "2026-01-01"
      input_per_million_usd: 0.00
      output_per_million_usd: 0.00
      unknown_cost_policy: conservative_fallback
      fallback_input_per_million_usd: 2.50
      fallback_output_per_million_usd: 10.00

tier_defaults:
  reasoning: "gemini-2.5-pro"
  balanced: "gemini-2.5-flash"
  fast: "gemini-2.5-flash"
  mock: "mock-model"
