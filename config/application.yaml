app:
  name: "SYNTRA"
  description: "Synchronized Intelligence for Autonomous Engineering"
  version: "0.1.0"
  tagline: "One Vision. Multiple AI Agents. Autonomous Engineering."
  environment: "development"

server:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  cors_origins:
    - "http://127.0.0.1:8000"
    - "http://localhost:8000"

persistence:
  database_url: "sqlite+aiosqlite:///./syntra.db"
  pool_size: 5
  max_overflow: 10

queue:
  redis_url: "redis://localhost:6379/0"

storage:
  s3:
    endpoint: "localhost:9000"
    access_key: "syntra_minio"
    secret_key: "syntra_minio_secret"
    bucket: "syntra-artifacts"
    secure: false

security:
  dev_auth_enabled: true
  token_expiry_hours: 24
