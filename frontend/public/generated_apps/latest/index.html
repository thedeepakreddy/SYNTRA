<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTRA // Nexus-09 Productivity HUD</title>
    <style>
        :root {
            --bg-color: #03070c;
            --panel-glass: rgba(8, 20, 32, 0.45);
            --panel-border: rgba(0, 240, 255, 0.25);
            --neon-teal: #00f0ff;
            --neon-cyan: #00ffd5;
            --neon-blue: #0088ff;
            --neon-glow: rgba(0, 240, 255, 0.4);
            --text-main: #e0f4ff;
            --text-dim: #5a829e;
            --danger: #ff0055;
            --font-hud: 'Courier New', Courier, monospace, system-ui;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-hud);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 3D Canvas Workspace */
        #workspace-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Cinematic Vignette & Scanlines */
        .cinematic-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 50%, transparent 30%, rgba(1, 4, 8, 0.85) 90%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
        }

        /* Holographic Application Interface Container */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* The Transparent Curved Glass Slate */
        .glass-slate {
            width: 90vw;
            max-width: 1350px;
            height: 82vh;
            max-height: 850px;
            background: var(--panel-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: 
                0 0 50px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(0, 240, 255, 0.05),
                0 0 25px rgba(0, 240, 255, 0.15);
            display: grid;
            grid-template-columns: 340px 1fr 340px;
            grid-template-rows: 70px 1fr;
            grid-template-areas: 
                "header header header"
                "sidebar main analytics";
            overflow: hidden;
            transform: rotateX(2deg) rotateY(-1deg);
            transition: transform 0.1s ease-out;
        }

        /* Glass Slate Header */
        .slate-header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            background: rgba(0, 15, 30, 0.3);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border: 2px solid var(--neon-teal);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px var(--neon-glow);
            animation: pulse-glow 3s infinite alternate;
        }

        .brand-logo::after {
            content: '';
            width: 14px;
            height: 14px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .brand-title h1 {
            font-size: 18px;
            letter-spacing: 4px;
            color: var(--neon-teal);
            text-shadow: 0 0 8px var(--neon-glow);
        }

        .brand-title p {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-dim);
        }

        .system-hud-metrics {
            display: flex;
            gap: 30px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .metric-item span {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        /* Sidebar: Quick Navigation & Add Task Panel */
        .sidebar {
            grid-area: sidebar;
            border-right: 1px solid rgba(0, 240, 255, 0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            background: rgba(0, 10, 20, 0.2);
        }

        .section-title {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '//';
            color: var(--neon-teal);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.1);
            color: var(--text-main);
            padding: 12px 18px;
            text-align: left;
            font-family: var(--font-hud);
            font-size: 12px;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(0, 240, 255, 0.08);
            border-color: var(--neon-teal);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            color: var(--neon-teal);
            padding-left: 22px;
        }

        .nav-badge {
            background: rgba(0, 240, 255, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: var(--neon-cyan);
        }

        /* Add Task Form inside Sidebar */
        .task-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .cyber-input {
            background: rgba(0, 10, 20, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-main);
            font-family: var(--font-hud);
            font-size: 12px;
            outline: none;
            transition: all 0.3s;
        }

        .cyber-input:focus {
            border-color: var(--neon-teal);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
        }

        .cyber-select {
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-main);
            font-family: var(--font-hud);
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .cyber-select option {
            background: #03070c;
            color: var(--text-main);
        }

        .cyber-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 136, 255, 0.2));
            border: 1px solid var(--neon-teal);
            color: var(--neon-teal);
            padding: 12px;
            font-family: var(--font-hud);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .cyber-btn:hover {
            background: var(--neon-teal);
            color: #000;
            box-shadow: 0 0 20px var(--neon-teal);
            transform: translateY(-2px);
        }

        /* Main Workspace: Active Tasks & Holographic Nodes */
        .main-workspace {
            grid-area: main;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .main-workspace::-webkit-scrollbar {
            width: 4px;
        }
        .main-workspace::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 2px;
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workspace-title h2 {
            font-size: 16px;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .workspace-title p {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Holographic Task Card Node */
        .task-card {
            position: relative;
            background: rgba(0, 20, 35, 0.35);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(4px);
            animation: fadeInNode 0.4s ease-out forwards;
        }

        .task-card:hover {
            border-color: var(--neon-teal);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            transform: translateX(4px);
            background: rgba(0, 30, 50, 0.5);
        }

        .task-card.priority-high {
            border-left: 4px solid var(--danger);
        }

        .task-card.priority-medium {
            border-left: 4px solid var(--neon-teal);
        }

        .task-card.priority-low {
            border-left: 4px solid var(--text-dim);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        /* Custom Neon Holographic Checkbox */
        .cyber-checkbox {
            position: relative;
            width: 22px;
            height: 22px;
            border: 1px solid var(--neon-teal);
            border-radius: 4px;
            background: rgba(0, 240, 255, 0.05);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .cyber-checkbox:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 12px var(--neon-teal);
        }

        .cyber-checkbox input {
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            position: absolute;
        }

        .cyber-checkbox .checkmark {
            width: 12px;
            height: 12px;
            background: var(--neon-cyan);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--neon-cyan);
            transform: scale(0);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cyber-checkbox input:checked ~ .checkmark {
            transform: scale(1);
        }

        .task-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-title {
            font-size: 13px;
            color: var(--text-main);
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: var(--text-dim);
        }

        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 10px;
            color: var(--text-dim);
        }

        .task-category {
            color: var(--neon-cyan);
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.15);
            color: var(--text-dim);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(255, 0, 85, 0.1);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        /* Right Panel: Analytics & HUD Metrics */
        .analytics-panel {
            grid-area: analytics;
            border-left: 1px solid rgba(0, 240, 255, 0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            background: rgba(0, 10, 20, 0.2);
        }

        .hud-ring-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hud-ring-container svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .hud-ring-bg {
            fill: none;
            stroke: rgba(0, 240, 255, 0.08);
            stroke-width: 10;
        }

        .hud-ring-progress {
            fill: none;
            stroke: url(#neonGradient);
            stroke-width: 10;
            stroke-dasharray: 502;
            stroke-dashoffset: 502;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 0 8px var(--neon-glow));
        }

        .hud-ring-center {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hud-percentage {
            font-size: 28px;
            font-weight: bold;
            color: var(--neon-teal);
            text-shadow: 0 0 10px var(--neon-glow);
        }

        .hud-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: rgba(0, 20, 35, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-box-value {
            font-size: 18px;
            color: var(--neon-cyan);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 213, 0.3);
        }

        .stat-box-label {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .system-audio-toggle {
            margin-top: auto;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .system-audio-toggle:hover {
            border-color: var(--neon-teal);
            background: rgba(0, 240, 255, 0.1);
        }

        .system-audio-toggle span {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .audio-status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 0, 85, 0.2);
            color: var(--danger);
            border: 1px solid rgba(255, 0, 85, 0.4);
        }

        .audio-status.active {
            background: rgba(0, 240, 255, 0.2);
            color: var(--neon-teal);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 15px;
            color: var(--text-dim);
            text-align: center;
            padding: 40px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-dim);
            opacity: 0.5;
            animation: floatIcon 3s ease-in-out infinite;
        }

        /* Animations */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--neon-glow); }
            100% { box-shadow: 0 0 20px var(--neon-teal); }
        }

        @keyframes fadeInNode {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Responsive Layout Adjustments */
        @media(max-width: 1024px) {
            .glass-slate {
                grid-template-columns: 280px 1fr;
                grid-template-areas: 
                    "header header"
                    "sidebar main";
                height: 90vh;
            }
            .analytics-panel {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Cinematic Overlays & Canvas -->
    <div class="cinematic-overlay"></div>
    <canvas id="workspace-canvas"></canvas>

    <!-- Holographic Application Container -->
    <div class="app-container">
        <div class="glass-slate" id="glassSlate">
            
            <!-- Header -->
            <header class="slate-header">
                <div class="brand-box">
                    <div class="brand-logo"></div>
                    <div class="brand-title">
                        <h1>SYNTRA // NEXUS-09</h1>
                        <p>PROMETHEUS PROTOCOL v4.82</p>
                    </div>
                </div>
                <div class="system-hud-metrics">
                    <div class="metric-item">CORE TEMP: <span id="sysTemp">34.8°C</span></div>
                    <div class="metric-item">SYNC RATE: <span id="sysSync">99.98%</span></div>
                    <div class="metric-item">LATENCY: <span id="sysPing">0.4ms</span></div>
                </div>
            </header>

            <!-- Sidebar: Navigation & Creation Hub -->
            <aside class="sidebar">
                <div>
                    <div class="section-title">Navigation</div>
                    <div class="nav-links">
                        <button class="nav-btn active" data-filter="all">
                            <span>All Protocols</span>
                            <span class="nav-badge" id="badgeAll">0</span>
                        </button>
                        <button class="nav-btn" data-filter="active">
                            <span>Active Nodes</span>
                            <span class="nav-badge" id="badgeActive">0</span>
                        </button>
                        <button class="nav-btn" data-filter="completed">
                            <span>Purged / Done</span>
                            <span class="nav-badge" id="badgeCompleted">0</span>
                        </button>
                    </div>
                </div>

                <div>
                    <div class="section-title">Categories</div>
                    <div class="nav-links">
                        <button class="nav-btn" data-category="Neural-Net">
                            <span>Neural-Net</span>
                        </button>
                        <button class="nav-btn" data-category="Quantum">
                            <span>Quantum Engine</span>
                        </button>
                        <button class="nav-btn" data-category="Cybernetics">
                            <span>Cybernetics</span>
                        </button>
                    </div>
                </div>

                <!-- Add Task Form -->
                <form class="task-form" id="taskForm">
                    <div class="section-title">Inject New Task</div>
                    <input type="text" class="cyber-input" id="taskInput" placeholder="Enter task designation..." required autocomplete="off">
                    <select class="cyber-select" id="taskCategory">
                        <option value="Neural-Net">Neural-Net</option>
                        <option value="Quantum">Quantum Engine</option>
                        <option value="Cybernetics">Cybernetics</option>
                    </select>
                    <select class="cyber-select" id="taskPriority">
                        <option value="medium">Priority: Medium</option>
                        <option value="high">Priority: High (Danger)</option>
                        <option value="low">Priority: Low</option>
                    </select>
                    <button type="submit" class="cyber-btn">+ Initialize Node</button>
                </form>
            </aside>

            <!-- Main Workspace: Task Feed -->
            <main class="main-workspace">
                <div class="workspace-header">
                    <div class="workspace-title">
                        <h2 id="workspaceTitleHeading">ACTIVE PROTOCOLS</h2>
                        <p id="workspaceSubHeading">Real-time neural wireframe task synchronization active.</p>
                    </div>
                </div>
                <div class="task-list" id="taskList">
                    <!-- Dynamic Task Nodes injected here -->
                </div>
            </main>

            <!-- Right Panel: HUD Analytics & Metrics -->
            <aside class="analytics-panel">
                <div class="section-title">Daily HUD Progress</div>
                
                <div class="hud-ring-container">
                    <svg viewBox="0 0 180 180">
                        <defs>
                            <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00f0ff" />
                                <stop offset="100%" stop-color="#00ffd5" />
                            </linearGradient>
                        </defs>
                        <circle class="hud-ring-bg" cx="90" cy="90" r="80"></circle>
                        <circle class="hud-ring-progress" id="hudProgressRing" cx="90" cy="90" r="80"></circle>
                    </svg>
                    <div class="hud-ring-center">
                        <div class="hud-percentage" id="hudPercentage">0%</div>
                        <div class="hud-label">OPTIMIZED</div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-box-value" id="statTotal">0</div>
                        <div class="stat-box-label">Total Nodes</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-box-value" id="statCompleted">0</div>
                        <div class="stat-box-label">Dissolved</div>
                    </div>
                </div>

                <div class="system-audio-toggle" id="audioToggleBtn">
                    <span>SYNTH AUDIO ENGINE</span>
                    <div class="audio-status" id="audioStatusText">OFF</div>
                </div>
            </aside>

        </div>
    </div>

    <!-- Application Logic & Three.js Style Custom Canvas Engine -->
    <script>
        /* ==========================================
           1. WEB AUDIO API SYNTHESIZER
           ========================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.enabled = !this.enabled;
                return this.enabled;
            }

            playBeep(freq = 440, type = 'sine', duration = 0.1, gainVal = 0.05) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {
                    console.error("Audio trigger failed", e);
                }
            }

            playClick() {
                this.playBeep(800, 'triangle', 0.05, 0.03);
            }

            playComplete() {

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            playAdd() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.1);

                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }
