[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devswarm"
version = "0.1.0"
description = "Production-oriented Autonomous Multi-Agent Software Engineering Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "DevSwarm Engineering Team", email = "dev@devswarm.syntra" },
]
keywords = ["multi-agent", "gemini", "autonomous-coding", "software-engineering", "hybrid-autonomy"]
dependencies = [
    "google-genai>=2.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
devswarm = "devswarm.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/devswarm"]
