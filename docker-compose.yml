services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: devswarm-backend:latest
    container_name: devswarm-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEVSWARM_DEFAULT_MODEL=${DEVSWARM_DEFAULT_MODEL:-gemini-2.5-flash}
      - DEVSWARM_REASONING_MODEL=${DEVSWARM_REASONING_MODEL:-gemini-2.5-pro}
      - DEVSWARM_FAST_MODEL=${DEVSWARM_FAST_MODEL:-gemini-2.0-flash-lite}
      - DEVSWARM_AUTONOMY_MODE=${DEVSWARM_AUTONOMY_MODE:-semi_autonomous}
      - DEVSWARM_DATABASE_URL=postgresql+asyncpg://devswarm:devswarm_secret@postgres:5432/devswarm_db
      - DEVSWARM_HOST=0.0.0.0
      - DEVSWARM_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - devswarm_data:/app/.devswarm

  postgres:
    image: postgres:16-alpine
    container_name: devswarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devswarm
      POSTGRES_PASSWORD: devswarm_secret
      POSTGRES_DB: devswarm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devswarm -d devswarm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  devswarm_data:
