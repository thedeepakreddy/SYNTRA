services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: syntra-backend:latest
    container_name: syntra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SYNTRA_DEFAULT_MODEL=${SYNTRA_DEFAULT_MODEL:-gemini-2.5-flash}
      - SYNTRA_REASONING_MODEL=${SYNTRA_REASONING_MODEL:-gemini-2.5-pro}
      - SYNTRA_FAST_MODEL=${SYNTRA_FAST_MODEL:-gemini-2.0-flash-lite}
      - SYNTRA_AUTONOMY_MODE=${SYNTRA_AUTONOMY_MODE:-semi_autonomous}
      - SYNTRA_DATABASE_URL=postgresql+asyncpg://syntra:syntra_secret@postgres:5432/syntra_db
      - SYNTRA_HOST=0.0.0.0
      - SYNTRA_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - syntra_data:/app/.syntra

  postgres:
    image: postgres:16-alpine
    container_name: syntra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: syntra_secret
      POSTGRES_DB: syntra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntra -d syntra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  syntra_data:
